[package]
name = "Taipu"
version = "0.3.0"
description = "A modern typing trainer app that helps users improve typing speed and accuracy through structured lessons and performance tracking"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "taipu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
tauri-plugin-shell = "2.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "9.0.0"
libsqlite3-sys = {version = "0.30.1", features = ["bundled"] }
dirs = "5.0.1"
diesel = { version = "2.0.0", features = ["sqlite", "chrono"] }
diesel_migrations = "2.0.0"
chrono = { version = "0.4.39", features = ["serde"] }
tauri-plugin-process = "2.0.0"
tauri-plugin-store = "2.4.3"

[dev-dependencies]
syn = { version = "2.0.71", features = ["full"] }
indoc = "2.0.5"
quote = "1.0.36"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
