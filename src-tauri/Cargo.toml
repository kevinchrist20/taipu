[package]
name = "Taipu"
version = "0.4.0"
description = "A modern typing trainer app that helps users improve typing speed and accuracy through structured lessons and performance tracking"
authors = [ "you" ]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "taipu_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [ "macos-private-api" ] }
tauri-plugin-shell = "2.6.0"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
ts-rs = "12.0.1"
libsqlite3-sys = { version = "0.40.0", features = [ "bundled" ] }
dirs = "7.0.0"
diesel = { version = "2.4.0", features = [
  "sqlite",
  "chrono"
] }
diesel_migrations = "2.4.0"
chrono = { version = "0.4.45", features = [ "serde" ] }
tauri-plugin-process = "2.4.0"
tauri-plugin-store = "2.5.1"

[dev-dependencies]
syn = { version = "2", features = [ "full" ] }
indoc = "2"
quote = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
